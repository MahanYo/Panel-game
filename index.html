<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>پنل مدیریت GameHub</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<style>
/* ... استایلهای پنل از پیام قبلی ... */
</style>
</head>
<body>
<div class="wrap">
  <h1>🎮 پنل مدیریت GameHub</h1>
  <p class="sub">مدیریت محصولات، تایید خریدها و ارسال اعلان</p>

  <div class="tabs">
    <button class="tab on" data-tab="purchases">خریدها</button>
    <button class="tab" data-tab="products">محصولات</button>
    <button class="tab" data-tab="notify">اعلان</button>
  </div>

  <!-- ===== خریدها ===== -->
  <div class="panel on" id="panel-purchases">
    <div class="card">
      <h3>📋 خریدهای در انتظار</h3>
      <div id="pendingList"></div>
    </div>
    <div class="card">
      <h3>✅ خریدهای تایید شده</h3>
      <div id="approvedList"></div>
    </div>
  </div>

  <!-- ===== محصولات ===== -->
  <div class="panel" id="panel-products">
    <div class="card">
      <h3>➕ محصول جدید</h3>
      <div class="field"><label>شناسه محصول (انگلیسی)</label><input id="p_pid" placeholder="gift_heart"></div>
      <div class="row">
        <div class="field"><label>دستهبندی</label>
          <select id="p_cat">
            <option value="gifts">گیفتها</option>
            <option value="stars">استارز</option>
            <option value="premium">پرمیوم</option>
            <option value="stickers">استیکر</option>
          </select>
        </div>
        <div class="field"><label>قیمت (سکه)</label><input id="p_price" type="number" placeholder="1000"></div>
      </div>
      <div class="field"><label>اسم فارسی</label><input id="p_nfa" placeholder="گیفت قلب"></div>
      <div class="field"><label>اسم انگلیسی</label><input id="p_nen" placeholder="Heart Gift"></div>
      <div class="field"><label>توضیحات فارسی</label><textarea id="p_dfa"></textarea></div>
      <div class="field"><label>توضیحات انگلیسی</label><textarea id="p_den"></textarea></div>
      <div class="field"><label>لینک عکس</label><input id="p_img" placeholder="https://..."></div>
      <div class="row">
        <div class="field"><label>موجودی (خالی = نامحدود)</label><input id="p_stock" type="number" placeholder="1"></div>
        <div class="field"><label>برچسب</label><input id="p_badge" placeholder="ویژه"></div>
      </div>
      <button class="btn" onclick="addProduct()">➕ افزودن محصول</button>
    </div>
    <div class="card">
      <h3>📦 محصولات موجود</h3>
      <div id="productsList"></div>
    </div>
  </div>

  <!-- ===== اعلان ===== -->
  <div class="panel" id="panel-notify">
    <div class="card">
      <h3>📢 ارسال اعلان به همه</h3>
      <div class="field"><label>عنوان</label><input id="n_title" placeholder="جشنواره ویژه!"></div>
      <div class="field"><label>متن پیام</label><textarea id="n_body" placeholder="۵۰٪ تخفیف روی همه گیفتها..."></textarea></div>
      <div class="field"><label>نوع</label>
        <select id="n_type">
          <option value="info">اطلاعیه</option>
          <option value="success">موفقیت</option>
          <option value="warning">هشدار</option>
        </select>
      </div>
      <button class="btn" onclick="sendNotification()">📢 ارسال</button>
    </div>
    <div class="card">
      <h3>📨 اعلانهای قبلی</h3>
      <div id="notifList"></div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== Tab switching =====
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick = ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
    document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
    t.classList.add('on');
    document.getElementById('panel-'+t.dataset.tab).classList.add('on');
  };
});

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t = setTimeout(()=>el.classList.remove('show'), 2000);
}

// ===== Load data =====
async function loadPurchases(){
  if(!sb) return;
  const { data, error } = await sb.from('purchases').select('*').order('created_at', { ascending: false });
  if(error){ toast('خطا در بارگذاری'); return; }

  const pending = (data||[]).filter(p=>p.status==='pending');
  const approved = (data||[]).filter(p=>p.status==='approved');

  document.getElementById('pendingList').innerHTML = pending.length ? pending.map(p=>`
    <div class="item">
      <img src="${p.product_image||''}" onerror="this.style.display='none'">
      <div class="info">
        <b>${p.product_name}</b>
        <span>${p.user_name} (@${p.user_username})</span>
        <span class="code">${p.code}</span>
        <span>${p.price} سکه</span>
      </div>
      <div class="actions">
        <button class="btn ok sm" onclick="approvePurchase('${p.id}')">✓</button>
        <button class="btn no sm" onclick="rejectPurchase('${p.id}')">✗</button>
      </div>
    </div>`).join('') : '<div class="empty">خرید در انتظاری نیست</div>';

  document.getElementById('approvedList').innerHTML = approved.length ? approved.map(p=>`
    <div class="item">
      <img src="${p.product_image||''}" onerror="this.style.display='none'">
      <div class="info">
        <b>${p.product_name}</b>
        <span>${p.user_name}</span>
        <span class="code">${p.code}</span>
      </div>
      <span class="badge approved">تایید شد</span>
    </div>`).join('') : '<div class="empty">هنوز چیزی تایید نشده</div>';
}

async function approvePurchase(id){
  if(!sb){ toast('⚠️ Supabase متصل نیست'); return; }

  const { data: p, error: e1 } = await sb.from('purchases').select('*').eq('id', id).single();
  if(e1 || !p){ toast('❌ خرید پیدا نشد'); return; }

  const { error: e2 } = await sb.from('purchases').update({
    status: 'approved',
    approved_at: new Date().toISOString()
  }).eq('id', id);
  if(e2){ toast('❌ خطا: '+e2.message); return; }

  if(p.product_id){
    const { data: prod } = await sb.from('products').select('stock').eq('id', p.product_id).single();
    if(prod && prod.stock !== null && prod.stock > 0){
      await sb.from('products').update({ stock: prod.stock - 1 }).eq('id', p.product_id);
    }
  }

  await sb.from('notifications').insert({
    title_fa: 'خرید شما تایید شد ✅',
    title_en: 'Purchase approved',
    body_fa: `محصول "${p.product_name}" با کد ${p.code} تایید شد.`,
    body_en: `Product "${p.product_name}" approved.`,
    type: 'success',
    target: p.user_id
  });

  toast('✅ تایید شد');
  loadPurchases();
  loadProducts();
}

async function rejectPurchase(id){
  if(!sb){ toast('⚠️ Supabase متصل نیست'); return; }
  const { data: p } = await sb.from('purchases').select('*').eq('id', id).single();
  if(!p) return;

  await sb.from('purchases').update({ status: 'rejected' }).eq('id', id);

  await sb.from('notifications').insert({
    title_fa: 'خرید شما رد شد ❌',
    title_en: 'Purchase rejected',
    body_fa: `متاسفانه خرید "${p.product_name}" رد شد.`,
    body_en: `Purchase rejected.`,
    type: 'warning',
    target: p.user_id
  });

  toast('رد شد');
  loadPurchases();
}

async function loadProducts(){
  if(!sb) return;
  const { data, error } = await sb.from('products').select('*').order('created_at', { ascending: false });
  if(error){ toast('خطا'); return; }
  document.getElementById('productsList').innerHTML = (data||[]).length ? data.map(p=>`
    <div class="item">
      <img src="${p.image}" onerror="this.style.display='none'">
      <div class="info">
        <b>${p.name_fa}</b>
        <span>${p.price} سکه · ${p.stock===null?'نامحدود':p.stock+' عدد'}</span>
        <span class="code">${p.product_id}</span>
      </div>
      <div class="actions">
        <button class="btn no sm" onclick="deleteProduct('${p.id}')">🗑</button>
      </div>
    </div>`).join('') : '<div class="empty">محصولی نیست</div>';
}

async function addProduct(){
  const pid = document.getElementById('p_pid').value.trim();
  const nfa = document.getElementById('p_nfa').value.trim();
  const img = document.getElementById('p_img').value.trim();
  const price = parseInt(document.getElementById('p_price').value);

  if(!pid || !nfa || !img || !price){ toast('⚠️ فیلدهای ضروری رو پر کن'); return; }
  if(!sb){ toast('⚠️ Supabase متصل نیست'); return; }

  const stockVal = document.getElementById('p_stock').value.trim();

  const { error } = await sb.from('products').insert({
    product_id: pid,
    category: document.getElementById('p_cat').value,
    name_fa: nfa,
    name_en: document.getElementById('p_nen').value.trim() || nfa,
    desc_fa: document.getElementById('p_dfa').value.trim(),
    desc_en: document.getElementById('p_den').value.trim(),
    image: img,
    price: price,
    stock: stockVal === '' ? null : parseInt(stockVal),
    badge_fa: document.getElementById('p_badge').value.trim() || null,
    active: true
  });

  if(error){ toast('❌ خطا: '+error.message); return; }

  toast('✅ محصول اضافه شد');
  ['p_pid','p_nfa','p_nen','p_dfa','p_den','p_img','p_stock','p_badge','p_price'].forEach(id=>document.getElementById(id).value='');
  loadProducts();
}

async function deleteProduct(id){
  if(!confirm('مطمئنی؟')) return;
  if(!sb){ toast('⚠️ Supabase متصل نیست'); return; }
  const { error } = await sb.from('products').delete().eq('id', id);
  if(error){ toast('❌ خطا: '+error.message); return; }
  toast('✅ حذف شد');
  loadProducts();
}

async function sendNotification(){
  const title = document.getElementById('n_title').value.trim();
  const body = document.getElementById('n_body').value.trim();
  if(!title || !body){ toast('⚠️ عنوان و متن رو پر کن'); return; }
  if(!sb){ toast('⚠️ Supabase متصل نیست'); return; }

  const { error } = await sb.from('notifications').insert({
    title_fa: title,
    title_en: title,
    body_fa: body,
    body_en: body,
    type: document.getElementById('n_type').value,
    target: 'all'
  });

  if(error){ toast('❌ خطا: ' + error.message); return; }
  toast('✅ اعلان ارسال شد');
  document.getElementById('n_title').value = '';
  document.getElementById('n_body').value = '';
  loadNotifications();
}

async function loadNotifications(){
  if(!sb) return;
  const { data } = await sb.from('notifications').select('*').order('created_at', { ascending: false }).limit(20);
  document.getElementById('notifList').innerHTML = (data||[]).length ? data.map(n=>`
    <div class="item">
      <div class="info">
        <b>${n.title_fa}</b>
        <span>${n.body_fa}</span>
        <span>${new Date(n.created_at).toLocaleString('fa-IR')}</span>
      </div>
      <span class="badge ${n.type==='success'?'approved':n.type==='warning'?'rejected':'pending'}">${n.type}</span>
    </div>`).join('') : '<div class="empty">اعلانی نیست</div>';
}

// ===== Realtime subscriptions =====
if(sb){
  sb.channel('admin-changes')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'purchases' }, ()=>{ loadPurchases(); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, ()=>{ loadProducts(); })
    .subscribe();
}

// ===== Init =====
loadPurchases();
loadProducts();
loadNotifications();
</script>
</body>
</html>
